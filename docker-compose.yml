services:
  db:
    build:
      context: ./infrastructure
      dockerfile: datastore/db/Dockerfile
    container_name: godepot-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - godepot-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: godepot-redis
    ports:
      - "6379:6379"
    volumes:
      - godepot-redis-data:/data

volumes:
  godepot-postgres-data:
  godepot-redis-data:
